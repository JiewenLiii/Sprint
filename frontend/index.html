<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地牢探险 - 游戏主页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container {
            max-width: 1400px;
        }
        .row {
            height: 600px;
        }
        .card {
            height: 100%;
        }
        .card-body {
            display: flex;
            flex-direction: column;
        }
        .map-grid {
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="flex-grow-1 text-center">
                <h1>⚔ 地牢探险 ⚔</h1>
            </div>
            <button id="btn-restart" class="btn btn-warning">重新开始</button>
        </div>

        <!-- 控制按钮区 -->
        <div class="mb-3 text-center">
            <button id="btn-start" class="btn btn-success me-2" style="display: none;">开始游戏</button>
        </div>

        <!-- 主要内容区域：三列布局 -->
        <div class="row mb-3" style="height: 500px;">
            <!-- 左侧：玩家状态 -->
            <div class="col-md-2">
                <div class="card h-100">
                    <div class="card-header">玩家状态</div>
                    <div class="card-body">
                        <div id="status-panel" class="status-panel">
                            <div class="status-items">
                                <p><strong>ID:</strong> <span id="player-id">-</span></p>
                                <p><strong>HP:</strong> <span id="player-hp">-</span></p>
                                <p><strong>攻击力:</strong> <span id="player-attack">-</span></p>
                                <p><strong>存活:</strong> <span id="player-alive">-</span></p>
                                <p><strong>位置:</strong> <span id="player-pos">-</span></p>
                                <p><strong>敌人:</strong> <span id="enemy-count">-</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中间：地图区域 -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">地图区域</div>
                    <div class="card-body d-flex justify-content-center align-items-center">
                        <div id="map-container" class="map-grid"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧：日志和方向键 -->
            <div class="col-md-4">
                <div class="h-100 d-flex flex-column gap-3">
                    <!-- 日志输出区 -->
                    <div class="" style="height: 70%;">
                        <div class="card h-100">
                            <div class="card-header">日志</div>
                            <div class="card-body d-flex flex-column">
                                <pre id="log-output" class="log-box" style="flex: 1; overflow-y: auto; max-height: 300px;"></pre>
                            </div>
                        </div>
                    </div>

                    <!-- 移动控制区 -->
                    <div class="" style="height: 30%;">
                        <div class="card h-100">
                            <div class="card-header">方向键</div>
                            <div class="card-body text-center">
                                <div class="directional-controls">
                                    <button id="btn-up" class="btn btn-secondary d-block mx-auto mb-1">↑</button>
                                    <div class="d-flex justify-content-center">
                                        <button id="btn-left" class="btn btn-secondary me-1">←</button>
                                        <button id="btn-down" class="btn btn-secondary mx-1">↓</button>
                                        <button id="btn-right" class="btn btn-secondary ms-1">→</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // 游戏状态变量
        let currentPlayerPos = [10, 10];
        let enemies = [];
        let gameStarted = false;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成，开始初始化...');
            initButtons();
            
            // 直接使用默认游戏数据
            console.log('使用默认游戏数据');
            displayGameInit({
                player: {
                    id: 'player-1',
                    hp: 100,
                    attack: 10,
                    isAlive: true
                },
                mapRender: {
                    playerPosition: [10, 10],
                    enemies: [
                        { id: 'enemy-1', position: [5, 5], hp: 20, attack: 5 },
                        { id: 'enemy-2', position: [15, 15], hp: 30, attack: 8 },
                        { id: 'enemy-3', position: [5, 15], hp: 25, attack: 6 },
                        { id: 'enemy-4', position: [15, 5], hp: 35, attack: 7 }
                    ]
                }
            });
            
            logOutput('log-output', '页面加载完成，显示默认游戏数据');
        });

        // 初始化按钮事件
        function initButtons() {
            // 开始游戏
            document.getElementById('btn-start').addEventListener('click', handleStartGame);
            
            // 重新开始
            document.getElementById('btn-restart').addEventListener('click', handleRestartGame);
            
            // 移动控制
            document.getElementById('btn-up').addEventListener('click', () => handleMove('up'));
            document.getElementById('btn-down').addEventListener('click', () => handleMove('down'));
            document.getElementById('btn-left').addEventListener('click', () => handleMove('left'));
            document.getElementById('btn-right').addEventListener('click', () => handleMove('right'));
        }

        // 开始游戏
        async function handleStartGame() {
            logOutput('log-output', '正在请求开始游戏...', 'info');
            
            try {
                const result = await GameAPI.startGame();
                
                if (result.success) {
                    logOutput('log-output', '游戏初始化成功！', 'success');
                    displayGameInit(result.data);
                } else {
                    logOutput('log-output', `开始游戏失败: ${result.error}`, 'error');
                    logOutput('log-output', '使用默认游戏数据...', 'info');
                    displayGameInit({
                        player: {
                            id: 'player-1',
                            hp: 100,
                            attack: 10,
                            isAlive: true
                        },
                        mapRender: {
                            playerPosition: [10, 10],
                            enemies: [
                                { id: 'enemy-1', position: [5, 5], hp: 20, attack: 5 },
                                { id: 'enemy-2', position: [15, 15], hp: 30, attack: 8 },
                                { id: 'enemy-3', position: [5, 15], hp: 25, attack: 6 },
                                { id: 'enemy-4', position: [15, 5], hp: 35, attack: 7 }
                            ]
                        }
                    });
                }
            } catch (error) {
                console.error('开始游戏错误:', error);
                logOutput('log-output', `开始游戏错误: ${error.message}`, 'error');
                logOutput('log-output', '使用默认游戏数据...', 'info');
                displayGameInit({
                    player: {
                        id: 'player-1',
                        hp: 100,
                        attack: 10,
                        isAlive: true
                    },
                    mapRender: {
                        playerPosition: [10, 10],
                        enemies: [
                            { id: 'enemy-1', position: [5, 5], hp: 20, attack: 5 },
                            { id: 'enemy-2', position: [15, 15], hp: 30, attack: 8 },
                            { id: 'enemy-3', position: [5, 15], hp: 25, attack: 6 },
                            { id: 'enemy-4', position: [15, 5], hp: 35, attack: 7 }
                        ]
                    }
                });
            }
        }

        // 重新开始游戏
        async function handleRestartGame() {
            logOutput('log-output', '正在请求重新开始游戏...', 'info');
            
            try {
                const result = await GameAPI.restartGame();
                
                if (result.success) {
                    logOutput('log-output', '游戏重新开始成功！', 'success');
                    displayGameInit(result.data);
                } else {
                    logOutput('log-output', `重新开始失败: ${result.error}`, 'error');
                    logOutput('log-output', '使用默认游戏数据...', 'info');
                    displayGameInit({
                        player: {
                            id: 'player-1',
                            hp: 100,
                            attack: 10,
                            isAlive: true
                        },
                        mapRender: {
                            playerPosition: [10, 10],
                            enemies: [
                                { id: 'enemy-1', position: [5, 5], hp: 20, attack: 5 },
                                { id: 'enemy-2', position: [15, 15], hp: 30, attack: 8 },
                                { id: 'enemy-3', position: [5, 15], hp: 25, attack: 6 },
                                { id: 'enemy-4', position: [15, 5], hp: 35, attack: 7 }
                            ]
                        }
                    });
                }
            } catch (error) {
                console.error('重新开始游戏错误:', error);
                logOutput('log-output', `重新开始游戏错误: ${error.message}`, 'error');
                logOutput('log-output', '使用默认游戏数据...', 'info');
                displayGameInit({
                    player: {
                        id: 'player-1',
                        hp: 100,
                        attack: 10,
                        isAlive: true
                    },
                    mapRender: {
                        playerPosition: [10, 10],
                        enemies: [
                            { id: 'enemy-1', position: [5, 5], hp: 20, attack: 5 },
                            { id: 'enemy-2', position: [15, 15], hp: 30, attack: 8 },
                            { id: 'enemy-3', position: [5, 15], hp: 25, attack: 6 },
                            { id: 'enemy-4', position: [15, 5], hp: 35, attack: 7 }
                        ]
                    }
                });
            }
        }

        // 显示游戏初始化数据
        function displayGameInit(data) {
            console.log('显示游戏初始化数据:', data);
            // 重置状态
            currentPlayerPos = [10, 10];
            gameStarted = true;
            
            // 保存敌人列表（用于遇敌检测）
            enemies = [];
            if (data.mapRender && data.mapRender.enemies) {
                const originalEnemies = data.mapRender.enemies;
                enemies = originalEnemies.map(e => {
                    const enemyCopy = {...e};
                    if (!enemyCopy.position || enemyCopy.position.length < 2) {
                        enemyCopy.position = [
                            Math.floor(Math.random() * 16) + 2, 
                            Math.floor(Math.random() * 16) + 2
                        ];
                        if (enemyCopy.position[0] === 10 && enemyCopy.position[1] === 10) {
                            enemyCopy.position = [9, 9];
                        }
                    }
                    return enemyCopy;
                });
                logOutput('log-output', `检测到 ${enemies.length} 个敌人，分布在地图上`, 'info');
            }
            
            // 显示状态面板
            document.getElementById('status-panel').style.display = 'block';

            // 显示玩家信息
            if (data.player) {
                console.log('更新玩家信息:', data.player);
                document.getElementById('player-id').textContent = data.player.id || '-';
                document.getElementById('player-hp').textContent = data.player.hp || '-';
                document.getElementById('player-attack').textContent = data.player.attack || '-';
                document.getElementById('player-alive').textContent = 
                    data.player.isAlive !== undefined ? (data.player.isAlive ? '✅ 存活' : '❌ 已死亡') : '✅ 存活';
                document.getElementById('player-pos').textContent = `(10, 10)`;
            }

            // 显示地图信息
            if (data.mapRender) {
                console.log('渲染地图:', data.mapRender);
                const mapRenderData = {...data.mapRender};
                mapRenderData.playerPosition = [...currentPlayerPos];
                mapRenderData.enemies = [...enemies];
                renderMap(mapRenderData);
                document.getElementById('enemy-count').textContent = enemies.length;
            }
        }

        // 渲染地图
        function renderMap(mapData) {
            const container = document.getElementById('map-container');
            container.innerHTML = '';

            if (!mapData) {
                container.innerHTML = '<p class="text-center text-muted">暂无地图数据</p>';
                return;
            }

            const playerPos = mapData.playerPosition || [10, 10];
            const enemies = mapData.enemies || [];

            // 更新显示
            document.getElementById('player-pos').textContent = `(${playerPos[0]}, ${playerPos[1]})`;
            document.getElementById('enemy-count').textContent = enemies.length;

            // 生成默认地图
            for (let y = 0; y < 20; y++) {
                for (let x = 0; x < 20; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'map-cell';

                    // 判断是否是玩家位置
                    if (playerPos[0] === x && playerPos[1] === y) {
                        cell.classList.add('player');
                        cell.textContent = '@';
                    }
                    // 判断是否是敌人位置
                    else if (enemies.some(e => {
                        const pos = e.position;
                        return Array.isArray(pos) && pos[0] === x && pos[1] === y;
                    })) {
                        cell.classList.add('enemy');
                        cell.textContent = 'E';
                    }
                    // 普通地形
                    else {
                        cell.classList.add('floor');
                        // 边缘是墙
                        if (x === 0 || x === 19 || y === 0 || y === 19) {
                            cell.textContent = '#';
                        } else {
                            cell.textContent = '.';
                        }
                    }

                    container.appendChild(cell);
                }
            }
        }

        // 移动玩家
        async function handleMove(direction) {
            if (!gameStarted) {
                logOutput('log-output', '请先点击「开始游戏」', 'error');
                return;
            }

            logOutput('log-output', `正在请求移动玩家: ${direction}...`, 'info');
            
            try {
                const result = await GameAPI.movePlayer(direction);
                
                if (result.success) {
                    // 更新玩家位置
                    updatePlayerPosition(direction);
                    
                    logOutput('log-output', `玩家移动成功: ${direction} → (${currentPlayerPos[0]}, ${currentPlayerPos[1]})`, 'success');
                    
                    // 更新位置显示
                    document.getElementById('player-pos').textContent = `(${currentPlayerPos[0]}, ${currentPlayerPos[1]})`;
                    
                    // 重新渲染地图
                    renderMap({
                        playerPosition: currentPlayerPos,
                        enemies: enemies
                    });
                    
                    // 检测是否遇到敌人
                    if (checkEnemyEncounter()) {
                        logOutput('log-output', '⚠️ 遇到敌人！自动进入战斗...', 'error');
                        
                        // 显示遇敌提示
                        showEncounterAlert();
                        
                        // 延迟跳转到战斗页面
                        setTimeout(() => {
                            window.location.href = 'combat.html';
                        }, 2000);
                    }
                } else {
                    logOutput('log-output', `移动失败: ${result.error}`, 'error');
                }
            } catch (error) {
                console.error('移动错误:', error);
                logOutput('log-output', `移动错误: ${error.message}`, 'error');
            }
        }

        // 更新玩家位置
        function updatePlayerPosition(direction) {
            const [x, y] = currentPlayerPos;
            
            switch (direction) {
                case 'up':
                    currentPlayerPos = [x, Math.max(1, y - 1)];
                    break;
                case 'down':
                    currentPlayerPos = [x, Math.min(18, y + 1)];
                    break;
                case 'left':
                    currentPlayerPos = [Math.max(1, x - 1), y];
                    break;
                case 'right':
                    currentPlayerPos = [Math.min(18, x + 1), y];
                    break;
            }
        }

        // 检查是否遇到敌人
        function checkEnemyEncounter() {
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                if (!enemy.position || enemy.position.length < 2) continue;
                
                const dx = Math.abs(currentPlayerPos[0] - enemy.position[0]);
                const dy = Math.abs(currentPlayerPos[1] - enemy.position[1]);
                
                // 邻接（包括对角线）
                if (dx <= 1 && dy <= 1) {
                    logOutput('log-output', `检测到敌人 ${enemy.id || 'Unknown'} 在位置 (${enemy.position[0]}, ${enemy.position[1]})`, 'error');
                    // 保存当前遭遇的敌人信息到 localStorage 供战斗页使用
                    localStorage.setItem('currentEnemy', JSON.stringify(enemy));
                    return true;
                }
            }
            return false;
        }

        // 显示遇敌提示
        function showEncounterAlert() {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger text-center';
            alert.innerHTML = '<strong>⚠️ 遇到敌人！即将进入战斗...</strong>';
            alert.style.position = 'fixed';
            alert.style.top = '20%';
            alert.style.left = '50%';
            alert.style.transform = 'translate(-50%, -50%)';
            alert.style.zIndex = '9999';
            alert.style.minWidth = '300px';
            alert.style.boxShadow = '0 0 20px rgba(218, 54, 51, 0.5)';
            
            document.body.appendChild(alert);
            
            // 2秒后移除
            setTimeout(() => {
                alert.remove();
            }, 2000);
        }

        // 日志输出工具
        function logOutput(elementId, message, type = 'info') {
            const logBox = document.getElementById(elementId);
            if (!logBox) return;

            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            logBox.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>

name: 自动运行单元测试
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 安装 C++ 编译器
        run: sudo apt update && sudo apt install g++ -y

      - name: 编译测试程序（适配你的项目结构）
        run: |
          g++ -std=c++17 \
          -I./src \
          -DDOCTEST_CONFIG_NO_MULTITHREADING \
          src/core/*.cpp \
          src/entities/*.cpp \
          src/ui/*.cpp \
          src/world/*.cpp \
          src/test/*.cpp \
          -o test_runner

      - name: 执行所有测试用例
        run: ./test_runner
name: 地牢探险游戏 全功能CI自动化流水线
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-cross-platform:
    name: 跨平台编译与校验
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: Linux 安装G++编译器
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update && sudo apt install g++ -y

      - name: Windows 配置MinGW编译环境
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: 编译游戏（严格模式）
        run: |
          g++ -std=c++11 -Wall -Werror -o dungeon \
          main.cpp \
          map.cpp \
          player.cpp \
          enemy.cpp \
          game.cpp \
          colors.cpp \
          entity.cpp \
          battle.cpp \
          renderer.cpp

      - name: 验证编译结果
        run: |
          if [ -f "./dungeon" ] || [ -f "./dungeon.exe" ]; then
            echo "✅ ${{ matrix.os }} 平台编译成功！"
          else
            echo "❌ ${{ matrix.os }} 平台编译失败！"
            exit 1
          fi
        shell: bash

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-game-${{ matrix.os }}
          path: |
            dungeon
            dungeon.exe
          if-no-files-found: error

- name: 创建编译输出目录
  run: mkdir -p build

- name: 编译游戏源码（模块化路径）
  run: |
    g++ -std=c++11 -Wall -o build/dungeon \
    src/main.cpp \
    src/core/game.cpp src/core/battle.cpp \
    src/entities/entity.cpp src/entities/player.cpp src/entities/enemy.cpp \
    src/world/map.cpp \
    src/ui/renderer.cpp src/ui/colors.cpp

- name: 验证编译结果
  run: test -f ./build/dungeon && echo "✅ 编译成功，develop分支保持Green Build" || exit 1

name: 地牢探险游戏 CI 自动化流水线
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: 跨平台编译校验
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false # 单平台失败不影响另一平台，完整展示结果

    steps:
      - name: 拉取代码（解决Node.js警告，强制用Node 22）
        uses: actions/checkout@v4
        with:
          node-version: "22" # 规避Node 20弃用警告，兼容GitHub未来要求
          fetch-depth: 0 # 拉取完整代码历史

      # ============== Linux 平台编译流程 ==============
      - name: Linux 安装GCC编译器
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install g++ -y

      - name: Linux 列出源码文件（排查用，确认文件完整）
        if: matrix.os == 'ubuntu-latest'
        run: ls -la *.cpp *.h

      - name: Linux 编译游戏（显式列出所有文件，彻底规避通配符问题）
        if: matrix.os == 'ubuntu-latest'
        run: g++ -std=c++11 -Wall -o dungeon main.cpp map.cpp player.cpp enemy.cpp game.cpp colors.cpp entity.cpp battle.cpp renderer.cpp

      - name: Linux 验证编译结果
        if: matrix.os == 'ubuntu-latest'
        run: test -f ./dungeon && echo "✅ Linux 平台编译成功" || exit 1

      # ============== Windows 平台编译流程（核心修复） ==============
      - name: Windows 配置稳定版MinGW
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v2.5.0
        with:
          platform: x64
          toolchain: mingw64

      - name: Windows 刷新环境变量（确保g++全局可用）
        if: matrix.os == 'windows-latest'
        run: refreshenv
        shell: powershell

      - name: Windows 列出源码文件（排查用，确认文件存在）
        if: matrix.os == 'windows-latest'
        run: ls -la *.cpp *.h
        shell: bash

      - name: Windows 编译游戏（显式列出所有文件，解决通配符兼容问题）
        if: matrix.os == 'windows-latest'
        run: g++ -std=c++11 -Wall -o dungeon.exe main.cpp map.cpp player.cpp enemy.cpp game.cpp colors.cpp entity.cpp battle.cpp renderer.cpp
        shell: bash

      - name: Windows 验证编译结果
        if: matrix.os == 'windows-latest'
        run: test -f ./dungeon.exe && echo "✅ Windows 平台编译成功" || exit 1
        shell: bash

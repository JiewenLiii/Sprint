name: 地牢探险游戏 CI 自动化流水线
# 触发规则：推送到develop、PR到develop、手动触发
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: 跨平台编译校验
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false # 一个平台失败不影响另一个，完整展示结果

    steps:
      - name: 拉取完整代码（保留所有历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，避免浅克隆问题

      # ============== Linux 平台编译流程 ==============
      - name: Linux 安装GCC编译器
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install g++ -y

      - name: Linux 编译游戏（通配符自动包含所有cpp文件，避免漏文件）
        if: matrix.os == 'ubuntu-latest'
        run: g++ -std=c++11 -Wall -o dungeon *.cpp

      - name: Linux 验证编译结果
        if: matrix.os == 'ubuntu-latest'
        run: test -f ./dungeon && echo "✅ Linux 平台编译成功" || exit 1

      # ============== Windows 平台编译流程 ==============
      - name: Windows 配置MinGW编译环境
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Windows 编译游戏（生成exe，适配Windows）
        if: matrix.os == 'windows-latest'
        run: g++ -std=c++11 -Wall -o dungeon.exe *.cpp

      - name: Windows 验证编译结果
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path -Path "./dungeon.exe") { 
            Write-Host "✅ Windows 平台编译成功" 
          } else { 
            exit 1 
          }
        shell: powershell

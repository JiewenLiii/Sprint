name: 地牢探险游戏 CI 自动化编译校验
on:
  push:
    branches: [develop, feature/*] # 允许develop和所有feature分支触发
  pull_request:
    branches: [develop] # PR到develop分支触发
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    name: 代码编译与质量校验
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取项目代码
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装GCC编译环境
      - name: 安装GCC编译环境
        run: |
          sudo apt update
          sudo apt install g++ -y

      # 3. 创建编译输出目录
      - name: 创建编译输出目录
        run: mkdir -p build

      # 4. 编译游戏源码（补全所有头文件搜索路径，含src/input）
      - name: 编译游戏源码（模块化路径+全头文件搜索）
        run: |
          g++ -std=c++11 -Wall \
          -I src \
          -I src/core \
          -I src/entities \
          -I src/world \
          -I src/ui \
          -I src/input \
          -o build/dungeon \
          src/main.cpp \
          src/core/game.cpp src/core/battle.cpp \
          src/entities/entity.cpp src/entities/player.cpp src/entities/enemy.cpp \
          src/world/map.cpp \
          src/ui/renderer.cpp src/ui/colors.cpp

      # 5. 验证编译结果
      - name: 验证编译结果
        run: test -f ./build/dungeon && echo "✅ 编译成功，develop分支持续Green Build" || exit 1

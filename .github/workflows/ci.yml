# SM: 补全Git Flow流程，feature分支反向同步主干
name: 地牢探险游戏 CI 自动化流水线
on:
  push:
    branches: [develop, feature/*]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: 跨平台编译校验
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linux 编译环境
      - name: Linux 安装GCC
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update && sudo apt install g++ -y

      - name: Linux 编译游戏
        if: matrix.os == 'ubuntu-latest'
        run: g++ -std=c++11 -Wall -I src -o dungeon src/main.cpp src/core/*.cpp src/entities/*.cpp src/world/*.cpp src/ui/*.cpp src/input/*.cpp

      - name: Linux 验证结果
        if: matrix.os == 'ubuntu-latest'
        run: test -f ./dungeon && echo "✅ Linux 编译成功" || exit 1

      # Windows 编译环境
      - name: Windows 配置MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Windows 编译游戏
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: g++ -std=c++11 -Wall -I src -o dungeon.exe src/main.cpp src/core/*.cpp src/entities/*.cpp src/world/*.cpp src/ui/*.cpp src/input/*.cpp

      - name: Windows 验证结果
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: test -f ./dungeon.exe && echo "✅ Windows 编译成功" || exit 1

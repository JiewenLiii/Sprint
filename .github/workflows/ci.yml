name: 地牢探险游戏 CI 自动化流水线
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: 跨平台编译校验
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      # 1. 基础拉取代码：移除 node-version 参数，修复 Ubuntu 报错
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============== Linux 平台 (100% 稳定) ==============
      - name: Linux 安装 GCC
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update && sudo apt install g++ -y

      - name: Linux 编译 (显式列文件)
        if: matrix.os == 'ubuntu-latest'
        run: g++ -std=c++11 -Wall -o dungeon main.cpp map.cpp player.cpp enemy.cpp game.cpp colors.cpp entity.cpp battle.cpp renderer.cpp

      - name: Linux 验证
        if: matrix.os == 'ubuntu-latest'
        run: test -f ./dungeon && echo "✅ Linux OK" || exit 1

      # ============== Windows 平台 (彻底换用 msys2，避免 mingw 版本坑) ==============
      - name: Windows 配置 MSYS2 环境 (稳定版)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: base-devel mingw-w64-x86_64-gcc

      - name: Windows 编译 (显式列文件)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0} # 强制使用 MSYS2 的 bash 环境
        run: g++ -std=c++11 -Wall -o dungeon.exe main.cpp map.cpp player.cpp enemy.cpp game.cpp colors.cpp entity.cpp battle.cpp renderer.cpp

      - name: Windows 验证
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: test -f ./dungeon.exe && echo "✅ Windows OK" || exit 1
